<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Logotipo Walkyria: monograma W entre colchetes de código">
  <circle cx="200" cy="200" r="180" fill="#352440" stroke="#F5B934" stroke-width="8"/>
  <circle cx="200" cy="200" r="158" fill="none" stroke="#F6F6F6" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>
  <!-- colchetes de código -->
  <polyline points="112,150 62,200 112,250" fill="none" stroke="#F6F6F6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="288,150 338,200 288,250" fill="none" stroke="#F6F6F6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- monograma W -->
  <polyline points="145,145 172,260 200,185 228,260 255,145" fill="none" stroke="#F5B934" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- estrela de qualidade -->
  <path d="M200 70 L208 92 L230 100 L208 108 L200 130 L192 108 L170 100 L192 92 Z" fill="#F5B934"/>
  <!-- barra full-stack (camadas) -->
  <rect x="150" y="288" width="100" height="10" rx="5" fill="#F6F6F6"/>
  <rect x="170" y="308" width="60" height="10" rx="5" fill="#F5B934"/>
</svg>
